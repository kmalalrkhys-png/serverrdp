name: Tailscale macOS Workflow

on:
  workflow_dispatch: # لتشغيل المهمة يدوياً من تبويب Actions

jobs:
  macos-tailscale:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. الاتصال بشبكة Tailscale باستخدام المفتاح الصحيح
    - name: Connect to Tailscale
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TAILSCAL_AUTH_KEY }}

    # 2. التحقق من حالة الاتصال وتنفيذ الأوامر
    - name: Run macOS Commands with Tailscale
      run: |
        echo "تم الاتصال بشبكة Tailscale بنجاح على macOS!"
        tailscale status
