name: macOS ARD via Tailscale

on:
  workflow_dispatch:

jobs:
  macos-ard:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. الاتصال بشبكة Tailscale
    - name: Connect to Tailscale
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TAILSCAL_AUTH_KEY }}

    # 2. تعيين كلمة مرور وتفعيل Apple Remote Desktop (ARD)
    - name: Enable Apple Remote Desktop and Set Password
      run: |
        echo "=== تعيين كلمة المرور للمستخدم runner ==="
        # تعيين كلمة المرور هنا (يمكنك تغيير 123456 إلى أي كلمة تريدها)
        echo "runner:123456" | sudo chpasswd
        
        echo "=== تفعيل Apple Remote Desktop (ARD) ==="
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -users runner -privs -all -restart -agent -menu
        
        echo "=========================================="
        echo "عنوان Tailscale IP الخاص بك هو:"
        tailscale ip -4
        echo "اسم المستخدم: runner"
        echo "كلمة المرور: 123456"
        echo "=========================================="

    # 3. إبقاء الجلسة مفتوحة للاتصال
    - name: Hold Runner Open
      run: |
        echo "الجلسة مفتوحة وجاهزة لاتصال ARD..."
        sleep 3600
        
